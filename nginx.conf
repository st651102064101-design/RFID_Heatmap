server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /speedtest.js {
        proxy_pass http://librespeed:8080/speedtest.js;
        proxy_set_header Host $host;
    }

    location = /speedtest_worker.js {
        proxy_pass http://librespeed:8080/speedtest_worker.js;
        proxy_set_header Host $host;
    }

    location /librespeed/ {
        proxy_pass http://librespeed:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
